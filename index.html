            <h2>01｜認識士林</h2>
            <p>士林對許多人來說，可能是熱鬧的夜市、陽明山的自然風景，或是假日適合出遊的景點。但對從小在這裡長大的我而言，士林不只是觀光地區，更是生活中熟悉的街道、學校和店家。</p>
            <p>從小學生活、假日與家人出遊，到長大後經常想念的餐廳，這些看似平凡的回憶，構成了我對士林最深刻的印象。</p>
